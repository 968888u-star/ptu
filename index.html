<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>像素级一比一克隆 · 改数字</title>
<!-- 引入各大 UI 和经典数字字体 -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Roboto:wght@300;400;500;700;900&family=Oswald:wght@400;500;600;700&family=Barlow+Condensed:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #4f46e5;
    --primary-hover: #4338ca;
    --bg: #0f1115;
    --panel: #161920;
    --border: #2a2f3d;
    --text: #e6e8ee;
    --subtext: #8b93a5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); height: 100vh; overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  .app { display: flex; height: 100vh; }

  /* 左侧面板 */
  .panel {
    width: 330px; flex: none; padding: 24px 20px;
    background: var(--panel); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 18px; overflow-y: auto;
  }
  .brand h1 { font-size: 18px; font-weight: 700; color: #fff; letter-spacing: 0.5px; }
  .brand p { font-size: 12px; color: var(--subtext); margin-top: 6px; }

  .group { display: flex; flex-direction: column; gap: 10px; }
  .glabel { font-size: 13px; color: var(--subtext); font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
  .glabel .badge { background: rgba(79, 70, 229, 0.2); color: #a5b4fc; padding: 2px 6px; border-radius: 4px; font-size: 10px; }
  
  input[type="text"] {
    background: #1b1f2a; border: 1px solid var(--border); color: #fff;
    border-radius: 8px; padding: 14px; font-size: 18px; width: 100%; outline: none;
    font-family: 'Inter', sans-serif; transition: 0.2s; letter-spacing: 1px;
  }
  input[type="text"]:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2); }
  
  select {
    background: #1b1f2a; border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 10px; font-size: 13px; width: 100%; outline: none;
  }

  .slider-row { display: flex; align-items: center; gap: 12px; }
  .slider-row span { font-size: 12px; color: var(--subtext); width: 36px; text-align: right; font-variant-numeric: tabular-nums; }
  input[type="range"] {
    -webkit-appearance: none; appearance: none; height: 4px; border-radius: 2px;
    background: var(--border); outline: none; flex: 1;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;
    background: var(--primary); cursor: pointer; border: 2px solid var(--panel);
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
  }

  button.primary {
    padding: 14px; border-radius: 10px; border: none; cursor: pointer;
    background: var(--primary); color: #fff; font-size: 15px; font-weight: 600;
    transition: 0.2s; display: flex; justify-content: center; align-items: center; gap: 8px;
  }
  button.primary:hover:not(:disabled) { background: var(--primary-hover); }
  button.primary:disabled { opacity: 0.5; cursor: not-allowed; }

  .tip { font-size: 11px; color: #fbbf24; line-height: 1.6; background: rgba(251, 191, 36, 0.1); padding: 10px; border-radius: 8px; border: 1px solid rgba(251, 191, 36, 0.2); }

  /* 右侧画布 */
  .stage {
    flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center;
    padding: 30px; position: relative; overflow: hidden;
    background: #0b0d10; background-image: radial-gradient(circle at center, #1a1d24 0%, #0b0d10 100%);
  }
  #cv { max-width: 100%; max-height: 100%; display: none; box-shadow: 0 20px 60px rgba(0,0,0,0.6); cursor: move; }
  .empty {
    text-align: center; color: var(--subtext); font-size: 15px; line-height: 2;
    cursor: pointer; padding: 60px; border: 2px dashed var(--border); border-radius: 20px;
    transition: 0.3s; background: rgba(22, 25, 32, 0.5);
  }
  .empty:hover { border-color: var(--primary); color: #fff; background: rgba(79, 70, 229, 0.05); }
</style>
</head>
<body>
<div class="app">
  <aside class="panel">
    <header class="brand">
      <h1>1:1 智能克隆引擎</h1>
      <p>自动测算原图字高、宽度、墨迹密度</p>
    </header>

    <button class="primary" id="uploadBtn">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4m4-5l5-5 5 5m-5-5v12"></path></svg>
      选择原图
    </button>

    <div class="group">
      <div class="glabel">新数字内容 <span class="badge">实时预览</span></div>
      <input type="text" id="textInput" value="+8,888.88" spellcheck="false">
    </div>

    <div class="group">
      <div class="glabel">字体特征匹配</div>
      <select id="fontSel">
        <option value="Inter, sans-serif">Inter (现代 UI 默认)</option>
        <option value="Roboto, sans-serif">Roboto (安卓/谷歌)</option>
        <option value="Oswald, sans-serif">Oswald (窄高/票据)</option>
        <option value="Barlow Condensed, sans-serif">Barlow (紧凑)</option>
        <option value="Share Tech Mono, monospace">Share Tech (等宽/代码)</option>
        <option value="Arial, sans-serif">Arial (经典)</option>
      </select>
    </div>

    <div class="group">
      <div class="glabel">微调对齐 (可选)</div>
      <div class="slider-row">
        <span>字重</span>
        <input type="range" id="weightRange" min="300" max="900" step="100" value="600">
        <span id="weightVal">600</span>
      </div>
      <div class="slider-row">
        <span>字宽</span>
        <input type="range" id="scaleXRange" min="70" max="130" step="1" value="100">
        <span id="scaleXVal">100%</span>
      </div>
      <div class="slider-row">
        <span>高度</span>
        <input type="range" id="scaleYRange" min="70" max="130" step="1" value="100">
        <span id="scaleYVal">100%</span>
      </div>
      <div class="slider-row">
        <span>字距</span>
        <input type="range" id="spacingRange" min="-10" max="20" step="0.5" value="0">
        <span id="spacingVal">0</span>
      </div>
    </div>

    <div class="tip">
      💡 <b>一键完美：</b>程序已自动测算尺寸和颜色。若位置有 1~2 像素偏差，可在右侧画布直接拖动，或用键盘方向键微调。
    </div>

    <button class="primary" id="downloadBtn" disabled style="margin-top:auto">下载无损原图</button>
  </aside>

  <main class="stage" id="stage">
    <div class="empty" id="empty">
      <div style="font-size:48px;margin-bottom:12px">🪄</div>
      <div>点击上传图片，自动进行像素级替换</div>
    </div>
    <canvas id="cv" tabindex="0"></canvas>
  </main>
</div>

<input type="file" id="fileInput" accept="image/*" hidden>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
(function () {
  'use strict';

  const $ = id => document.getElementById(id);
  const canvas = $('cv');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const stage = $('stage');
  const emptyEl = $('empty');
  const fileInput = $('fileInput');
  const textInput = $('textInput');
  const fontSel = $('fontSel');
  const weightRange = $('weightRange');
  const scaleXRange = $('scaleXRange');
  const scaleYRange = $('scaleYRange');
  const spacingRange = $('spacingRange');
  const downloadBtn = $('downloadBtn');

  const state = {
    img: null, W: 0, H: 0,
    targetBox: null, // 包含真实墨迹边界和颜色
    newText: '+8,888.88',
    font: 'Inter, sans-serif',
    weight: 600,
    scaleX: 1, scaleY: 1, spacing: 0,
    offsetX: 0, offsetY: 0
  };

  let worker = null;
  let isDragging = false;
  let dragStart = { x: 0, y: 0 };

  // ================= 1. 深度图像化验分析 =================
  
  // 获取真正的“墨迹”边界（去留白）
  function getRealInkBounds(box, data, W, H) {
    let minX = box.x1, maxX = box.x0, minY = box.y1, maxY = box.y0;
    let fgCount = 0;
    
    // 采样背景色（取外围）
    const outerBg = [255,255,255]; // 默认
    const pad = 15;
    let rSum=0, gSum=0, bSum=0, cnt=0;
    for(let y=Math.max(0,box.y0-pad); y<Math.min(H,box.y1+pad); y++){
        for(let x=Math.max(0,box.x0-pad); x<Math.min(W,box.x1+pad); x++){
            if(x>=box.x0 && x<=box.x1 && y>=box.y0 && y<=box.y1) continue;
            const i = (y*W+x)*4; rSum+=data[i]; gSum+=data[i+1]; bSum+=data[i+2]; cnt++;
        }
    }
    if(cnt>0) { outerBg[0]=rSum/cnt; outerBg[1]=gSum/cnt; outerBg[2]=bSum/cnt; }

    // 寻找真实边界
    for (let y = Math.max(0, Math.floor(box.y0)); y < Math.min(H, box.y1); y++) {
      for (let x = Math.max(0, Math.floor(box.x0)); x < Math.min(W, box.x1); x++) {
        const i = (y * W + x) * 4;
        const r = data[i], g = data[i+1], b = data[i+2];
        // 容差：与背景色的差异大于阈值，认为是文字
        const diff = Math.abs(r - outerBg[0]) + Math.abs(g - outerBg[1]) + Math.abs(b - outerBg[2]);
        if (diff > 80) {
          fgCount++;
          if (x < minX) minX = x; if (x > maxX) maxX = x;
          if (y < minY) minY = y; if (y > maxY) maxY = y;
        }
      }
    }

    // 若未找到（可能是纯色块），退回原框
    if (fgCount < 10) return { ...box, inkRatio: 0, fg: [0,0,0], bg: outerBg };

    const realW = Math.max(1, maxX - minX);
    const realH = Math.max(1, maxY - minY);
    const inkRatio = fgCount / (realW * realH); // 墨迹密度

    // 在真实边界内寻找前景文字色（最深的像素均值）
    const fgPixels = [];
    for (let y = minY; y <= maxY; y++) {
      for (let x = minX; x <= maxX; x++) {
        const i = (y * W + x) * 4;
        const r = data[i], g = data[i+1], b = data[i+2];
        const diff = Math.abs(r - outerBg[0]) + Math.abs(g - outerBg[1]) + Math.abs(b - outerBg[2]);
        fgPixels.push({ d: diff, r, g, b });
      }
    }
    fgPixels.sort((a, b) => b.d - a.d);
    let fg = [0,0,0];
    if(fgPixels.length>0){
        const topN = Math.max(1, Math.floor(fgPixels.length * 0.15)); // 取最深的 15%
        let r=0,g=0,b=0; for(let i=0;i<topN;i++){ r+=fgPixels[i].r; g+=fgPixels[i].g; b+=fgPixels[i].b; }
        fg = [Math.round(r/topN), Math.round(g/topN), Math.round(b/topN)];
    }

    return {
      x0: minX, y0: minY, x1: maxX, y1: maxY,
      w: realW, h: realH,
      inkRatio, fg, bg: outerBg
    };
  }

  // ================= 2. 核心高保真绘制 =================
  
  function getTextWidth(text, letterSpacing) {
    let w = 0;
    for (let i = 0; i < text.length; i++) w += ctx.measureText(text[i]).width + letterSpacing;
    return w - (text.length > 0 ? letterSpacing : 0);
  }

  function drawTextWithSpacing(text, x, y, letterSpacing) {
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    let currentX = x;
    for (let i = 0; i < text.length; i++) {
      ctx.fillText(text[i], currentX, y);
      currentX += ctx.measureText(text[i]).width + letterSpacing;
    }
  }

  function renderResult() {
    if (!state.img) return;
    const W = state.W, H = state.H;

    // 清空画布
    ctx.clearRect(0, 0, W, H);
    ctx.drawImage(state.img, 0, 0, W, H);

    const box = state.targetBox;
    if (!box) return;

    // 1. 极简遮盖：只覆盖文字所在的真实墨迹边缘，加上 1~2 像素的羽化保护
    ctx.fillStyle = `rgb(${box.bg.map(v=>Math.round(v)).join(',')})`;
    const coverPadX = Math.max(1, box.w * 0.05);
    const coverPadY = Math.max(1, box.h * 0.05);
    ctx.fillRect(box.x0 - coverPadX, box.y0 - coverPadY, box.w + coverPadX*2, box.h + coverPadY*2);

    // 2. 准备文字
    const text = state.newText;
    if (!text) return;

    // 3. 核心计算：让字体物理高度绝对等于原图物理高度
    ctx.font = `${state.weight} 100px ${state.font}`;
    // 使用度量数据获取 "100px" 下文字的真实墨迹高度
    const metrics = ctx.measureText(text);
    const rawH = metrics.actualBoundingBoxAscent + metrics.actualBoundingBoxDescent;
    
    // 计算出完美字号
    let baseFontSize = 100;
    if (rawH > 0) {
      baseFontSize = (box.h / rawH) * 100;
    }

    // 4. 宽高自适应（如果输入的文字比原图长，自动压缩字宽，保持不外溢）
    ctx.font = `${state.weight} ${baseFontSize}px ${state.font}`;
    const spacing = state.spacing * (baseFontSize / 100);
    const rawW = getTextWidth(text, spacing);
    
    // 计算宽高比缩放
    let finalScaleX = state.scaleX;
    let finalScaleY = state.scaleY;

    // 限制最大宽度为原框宽度的 1.25 倍，防止完全破坏排版（如需更宽可以放开）
    if (rawW > box.w * 1.25 && state.scaleX === 1) {
        finalScaleX = (box.w * 1.25) / rawW;
    }

    ctx.save();
    
    // 设定中心点 + 手动偏移
    const centerX = box.x0 + box.w / 2 + state.offsetX;
    const centerY = box.y0 + box.h / 2 + state.offsetY;
    
    // 应用横向和纵向缩放
    ctx.translate(centerX, centerY);
    ctx.scale(finalScaleX, finalScaleY);
    ctx.translate(-centerX, -centerY);

    // 应用颜色
    ctx.fillStyle = `rgb(${box.fg.join(',')})`;

    // 绘制（起始点居中）
    const drawW = rawW * finalScaleX;
    const startX = centerX - drawW / 2;
    
    // 调整 Y 轴基点：让文字的视觉中心对齐框的中心
    // actualBoundingBoxAscent 是基线到顶部的距离
    const yOffset = (metrics.actualBoundingBoxAscent - metrics.actualBoundingBoxDescent) / 2;
    const finalY = centerY + yOffset * finalScaleY;

    drawTextWithSpacing(text, startX, finalY, spacing);

    ctx.restore();
  }

  // ================= 3. OCR 识别 =================
  async function runOCR() {
    const os = Math.min(2.0, 2000 / Math.max(state.W, state.H)); // 放大以提高识别率
    const oc = document.createElement('canvas');
    oc.width = Math.round(state.W * os);
    oc.height = Math.round(state.H * os);
    const octx = oc.getContext('2d');
    
    // 增强对比度，利于二值化识别
    octx.filter = 'contrast(1.5) grayscale(1)';
    octx.drawImage(state.img, 0, 0, oc.width, oc.height);

    if (!worker) {
      worker = await Tesseract.createWorker('eng', 1, {
        logger: m => {
          if (m.status === 'recognizing text') {
            emptyEl.innerHTML = `<div>AI 正在分析像素特征... ${Math.round(m.progress*100)}%</div>`;
          }
        }
      });
    }

    await worker.setParameters({ tessedit_char_whitelist: '0123456789.,+-$%' });
    const { data } = await worker.recognize(oc);
    const sc = state.W / oc.width;

    const words = (data.words || []).filter(w => w.text.trim().length > 0 && w.confidence > 30);
    
    // 找到面积最大的那个连续数字区域（往往是主数字）
    let targetBox = null;
    let maxArea = 0;

    for (const w of words) {
      const box = {
        x0: w.bbox.x0 * sc, y0: w.bbox.y0 * sc,
        x1: w.bbox.x1 * sc, y1: w.bbox.y1 * sc,
      };
      box.w = box.x1 - box.x0;
      box.h = box.y1 - box.y0;
      const area = box.w * box.h;
      
      if (box.h > 10 && area > maxArea) {
        maxArea = area;
        targetBox = box;
      }
    }

    // 如果没找到，把整张图当做目标
    if (!targetBox) {
      targetBox = { x0: state.W*0.1, y0: state.H*0.4, x1: state.W*0.9, y1: state.H*0.6, w: state.W*0.8, h: state.H*0.2 };
    }

    // 深度分析色彩和边界
    const imgData = ctx.getImageData(0, 0, state.W, state.H).data;
    return getRealInkBounds(targetBox, imgData, state.W, state.H);
  }

  // ================= 4. 事件处理 =================
  async function handleFile(file) {
    if (!file || !file.type.startsWith('image/')) return;
    
    emptyEl.style.display = 'block';
    emptyEl.innerHTML = `<div>正在载入...</div>`;
    canvas.style.display = 'none';

    const url = URL.createObjectURL(file);
    const im = new Image();
    
    im.onload = async () => {
      state.img = im;
      // 限制最大尺寸，防止手机卡死
      const maxSide = 2000;
      const scale = Math.min(1, maxSide / Math.max(im.width, im.height));
      state.W = Math.round(im.width * scale);
      state.H = Math.round(im.height * scale);
      
      canvas.width = state.W;
      canvas.height = state.H;
      ctx.drawImage(im, 0, 0, state.W, state.H);
      
      try {
        state.targetBox = await runOCR();
        
        // 智能预判字重
        if (state.targetBox.inkRatio > 0.25) {
          weightRange.value = 700;
        } else if (state.targetBox.inkRatio < 0.1) {
          weightRange.value = 400;
        } else {
          weightRange.value = 600;
        }
        $('weightVal').textContent = weightRange.value;
        state.weight = parseInt(weightRange.value);

        state.offsetX = 0; state.offsetY = 0;
        state.scaleX = 1; state.scaleY = 1;
        scaleXRange.value = 100; scaleYRange.value = 100;
        $('scaleXVal').textContent = '100%'; $('scaleYVal').textContent = '100%';
        
        renderResult();
        
        emptyEl.style.display = 'none';
        canvas.style.display = 'block';
        canvas.focus();
        downloadBtn.disabled = false;
        
      } catch (err) {
        alert("识别失败: " + err.message);
        emptyEl.innerHTML = `<div>识别失败，请重试</div>`;
      }
      URL.revokeObjectURL(url);
    };
    im.src = url;
  }

  $('uploadBtn').onclick = () => fileInput.click();
  emptyEl.onclick = () => fileInput.click();
  fileInput.onchange = e => {
    if (e.target.files[0]) handleFile(e.target.files[0]);
    fileInput.value = '';
  };

  // 实时参数绑定
  textInput.oninput = e => { state.newText = e.target.value; renderResult(); };
  fontSel.onchange = e => { state.font = e.target.value; renderResult(); };
  
  weightRange.oninput = e => { state.weight = parseInt(e.target.value); $('weightVal').textContent = e.target.value; renderResult(); };
  scaleXRange.oninput = e => { state.scaleX = parseInt(e.target.value) / 100; $('scaleXVal').textContent = e.target.value + '%'; renderResult(); };
  scaleYRange.oninput = e => { state.scaleY = parseInt(e.target.value) / 100; $('scaleYVal').textContent = e.target.value + '%'; renderResult(); };
  spacingRange.oninput = e => { state.spacing = parseFloat(e.target.value); $('spacingVal').textContent = e.target.value; renderResult(); };

  // 鼠标拖拽 1px 对齐
  canvas.addEventListener('pointerdown', e => {
    if (!state.img) return;
    isDragging = true;
    dragStart = { x: e.clientX, y: e.clientY };
    canvas.setPointerCapture(e.pointerId);
  });

  canvas.addEventListener('pointermove', e => {
    if (!isDragging) return;
    const dx = e.clientX - dragStart.x;
    const dy = e.clientY - dragStart.y;
    const rect = canvas.getBoundingClientRect();
    
    state.offsetX += dx * (state.W / rect.width);
    state.offsetY += dy * (state.H / rect.height);
    
    dragStart = { x: e.clientX, y: e.clientY };
    renderResult();
  });

  canvas.addEventListener('pointerup', e => {
    isDragging = false;
    canvas.releasePointerCapture(e.pointerId);
  });

  // 键盘方向键微调
  canvas.addEventListener('keydown', e => {
    if (!state.img) return;
    const step = e.shiftKey ? 10 : 1;
    let moved = false;
    if (e.key === 'ArrowLeft') { state.offsetX -= step; moved = true; }
    if (e.key === 'ArrowRight') { state.offsetX += step; moved = true; }
    if (e.key === 'ArrowUp') { state.offsetY -= step; moved = true; }
    if (e.key === 'ArrowDown') { state.offsetY += step; moved = true; }
    if (moved) { e.preventDefault(); renderResult(); }
  });

  downloadBtn.onclick = () => {
    if (!state.img) return;
    canvas.toBlob(blob => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = '完美克隆_' + Date.now() + '.png';
      a.click();
    }, 'image/png');
  };

  // 拖拽上传
  ['dragenter', 'dragover'].forEach(t => document.addEventListener(t, e => {
    e.preventDefault(); stage.style.border = '2px dashed #4f46e5';
  }));
  ['dragleave', 'drop'].forEach(t => document.addEventListener(t, e => {
    e.preventDefault(); stage.style.border = 'none';
    if (t === 'drop' && e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
  }));

})();
</script>
</body>
</html>
