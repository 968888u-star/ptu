<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>像素级克隆 · 改数字神器</title>
<!-- 引入最接近现代 UI 截图的字体 -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #3b82f6;
    --primary-hover: #2563eb;
    --bg: #0f1115;
    --panel: #161920;
    --border: #2a2f3d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: #e6e8ee; height: 100vh; overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  .app { display: flex; height: 100vh; }

  /* 左侧面板 */
  .panel {
    width: 340px; flex: none; padding: 20px 18px;
    background: var(--panel); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 14px; overflow-y: auto;
  }
  .brand h1 { font-size: 18px; font-weight: 700; color: #fff; }
  .brand p { font-size: 12px; color: #7c8399; margin-top: 4px; }

  .group { display: flex; flex-direction: column; gap: 8px; }
  .glabel { font-size: 12px; color: #7c8399; font-weight: 600; display: flex; justify-content: space-between; }
  
  input[type="text"] {
    background: #1b1f2a; border: 1px solid var(--border); color: #e6e8ee;
    border-radius: 8px; padding: 12px; font-size: 16px; width: 100%; outline: none; font-family: inherit;
  }
  input[type="text"]:focus { border-color: var(--primary); }
  
  select {
    background: #1b1f2a; border: 1px solid var(--border); color: #e6e8ee;
    border-radius: 8px; padding: 10px; font-size: 13px; width: 100%; outline: none;
  }

  input[type="range"] {
    -webkit-appearance: none; appearance: none; height: 4px; border-radius: 2px;
    background: #2a2f3d; outline: none; flex: 1;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;
    background: var(--primary); cursor: pointer; border: 2px solid var(--panel);
  }
  .row { display: flex; align-items: center; gap: 10px; }
  .row span { font-size: 12px; color: #7c8399; width: 40px; }

  button.primary {
    padding: 14px; border-radius: 10px; border: none; cursor: pointer;
    background: var(--primary); color: #fff; font-size: 15px; font-weight: 600;
    transition: .2s;
  }
  button.primary:hover:not(:disabled) { background: var(--primary-hover); }
  button.primary:disabled { opacity: .5; cursor: not-allowed; }

  /* 右侧画布 */
  .stage {
    flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center;
    padding: 20px; position: relative; overflow: hidden;
    background: #11141a;
  }
  #cv { max-width: 100%; max-height: 100%; display: none; box-shadow: 0 10px 40px rgba(0,0,0,.5); cursor: move; }
  .empty {
    text-align: center; color: #5c6377; font-size: 15px; line-height: 2;
    cursor: pointer; padding: 60px; border: 2px dashed var(--border); border-radius: 16px;
  }
  .empty:hover { border-color: var(--primary); color: #8a93a8; }
  .tip { font-size: 11px; color: #f59e0b; line-height: 1.5; margin-top: 5px; }
</style>
</head>
<body>
<div class="app">
  <aside class="panel">
    <header class="brand">
      <h1>像素级克隆改数字</h1>
      <p>还原字体细节 · 完美覆盖</p>
    </header>

    <button class="primary" id="uploadBtn">1. 选择图片</button>

    <div class="group">
      <div class="glabel">2. 输入新内容</div>
      <input type="text" id="textInput" value="+8,888.88" spellcheck="false">
    </div>

    <div class="group">
      <div class="glabel">3. 匹配字体风格</div>
      <select id="fontSel">
        <option value="Inter, sans-serif">Inter (现代 UI 极简)</option>
        <option value="Roboto, sans-serif">Roboto (安卓/谷歌风)</option>
        <option value="Arial, sans-serif">Arial (经典无衬线)</option>
        <option value="Helvetica, sans-serif">Helvetica (苹果风)</option>
      </select>
      
      <div class="row" style="margin-top:5px">
        <span>字重</span>
        <input type="range" id="weightRange" min="300" max="900" step="100" value="500">
        <span id="weightVal" style="text-align:right">500</span>
      </div>
      
      <div class="row">
        <span>字距</span>
        <input type="range" id="spacingRange" min="-5" max="10" step="0.5" value="0">
        <span id="spacingVal" style="text-align:right">0</span>
      </div>

      <div class="row">
        <span>缩放</span>
        <input type="range" id="scaleRange" min="80" max="120" step="1" value="100">
        <span id="scaleVal" style="text-align:right">100%</span>
      </div>
    </div>

    <div class="tip">💡 提示：生成后，可以用键盘的 ↑↓←→ 键进行 1 像素级别的微调对齐！</div>

    <button class="primary" id="downloadBtn" disabled style="margin-top:10px">下载高清图片</button>
  </aside>

  <main class="stage" id="stage">
    <div class="empty" id="empty">
      <div style="font-size:40px;margin-bottom:10px">✨</div>
      <div>点击上传图片</div>
    </div>
    <canvas id="cv" tabindex="0"></canvas>
  </main>
</div>

<input type="file" id="fileInput" accept="image/*" hidden>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
(function () {
  'use strict';

  const $ = id => document.getElementById(id);
  const canvas = $('cv');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const stage = $('stage');
  const emptyEl = $('empty');
  const fileInput = $('fileInput');
  const textInput = $('textInput');
  const fontSel = $('fontSel');
  const weightRange = $('weightRange');
  const spacingRange = $('spacingRange');
  const scaleRange = $('scaleRange');
  const downloadBtn = $('downloadBtn');

  const state = {
    img: null, W: 0, H: 0,
    boxes: [], // 识别出的数字区域
    newText: '+8,888.88',
    font: 'Inter, sans-serif',
    weight: 500,
    spacing: 0,
    scale: 1,
    offsetX: 0,
    offsetY: 0,
    activeBoxIndex: 0 // 默认只修改第一个识别到的区域
  };

  let worker = null;
  let isDragging = false;
  let dragStart = { x: 0, y: 0 };

  // ================= 核心：提取完美的背景与前景色 =================
  function analyzeRegion(box, imgData, W, H) {
    const bgCounts = new Map();
    const fgPixels = [];
    const { x0, y0, x1, y1 } = box;
    
    // 稍微扩大范围采样背景
    const pad = 10;
    for (let y = Math.max(0, y0 - pad); y < Math.min(H, y1 + pad); y++) {
      for (let x = Math.max(0, x0 - pad); x < Math.min(W, x1 + pad); x++) {
        // 判断是否在文字框内
        if (x >= x0 && x <= x1 && y >= y0 && y <= y1) continue; 
        
        const i = (y * W + x) * 4;
        const key = ((imgData[i] >> 4) << 8) | ((imgData[i + 1] >> 4) << 4) | (imgData[i + 2] >> 4);
        let c = bgCounts.get(key);
        if (!c) { c = { n: 0, r: 0, g: 0, b: 0 }; bgCounts.set(key, c); }
        c.n++; c.r += imgData[i]; c.g += imgData[i + 1]; c.b += imgData[i + 2];
      }
    }

    let bestBg = { n: 0, r: 255, g: 255, b: 255 };
    bgCounts.forEach(c => { if (c.n > bestBg.n) bestBg = c; });
    const bg = [Math.round(bestBg.r / bestBg.n), Math.round(bestBg.g / bestBg.n), Math.round(bestBg.b / bestBg.n)];

    // 在框内寻找文字颜色
    for (let y = y0; y <= y1; y++) {
      for (let x = x0; x <= x1; x++) {
        const i = (y * W + x) * 4;
        const r = imgData[i], g = imgData[i + 1], b = imgData[i + 2];
        const diff = Math.abs(r - bg[0]) + Math.abs(g - bg[1]) + Math.abs(b - bg[2]);
        if (diff > 150) { // 明显区别于背景的算作文字
          fgPixels.push({ d: diff, r, g, b });
        }
      }
    }

    fgPixels.sort((a, b) => b.d - a.d);
    let fg = [0, 0, 0];
    if (fgPixels.length > 0) {
      const n = Math.max(1, Math.floor(fgPixels.length * 0.2)); // 取最黑的20%
      let r = 0, g = 0, b = 0;
      for (let i = 0; i < n; i++) { r += fgPixels[i].r; g += fgPixels[i].g; b += fgPixels[i].b; }
      fg = [Math.round(r / n), Math.round(g / n), Math.round(b / n)];
    }

    return { bg, fg };
  }

  // ================= 精确绘制文字（支持字距调整） =================
  function drawTextWithSpacing(text, x, y, letterSpacing) {
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    let currentX = x;
    
    for (let i = 0; i < text.length; i++) {
      const char = text[i];
      ctx.fillText(char, currentX, y);
      currentX += ctx.measureText(char).width + letterSpacing;
    }
  }

  // 获取文字总宽度
  function getTextWidth(text, letterSpacing) {
    let w = 0;
    for (let i = 0; i < text.length; i++) {
      w += ctx.measureText(text[i]).width + letterSpacing;
    }
    return w - letterSpacing;
  }

  // ================= 核心渲染 =================
  function renderResult() {
    if (!state.img) return;
    const W = state.W, H = state.H;

    ctx.clearRect(0, 0, W, H);
    ctx.drawImage(state.img, 0, 0, W, H);

    const box = state.boxes[state.activeBoxIndex];
    if (!box) return;

    // 1. 用算出的完美背景色，稍微扩大一点覆盖旧数字（彻底遮盖）
    ctx.fillStyle = `rgb(${box.bg.join(',')})`;
    // 扩大 15% 确保盖住边缘的抗锯齿像素
    const coverPadX = box.w * 0.15;
    const coverPadY = box.h * 0.15;
    ctx.fillRect(box.x0 - coverPadX, box.y0 - coverPadY, box.w + coverPadX * 2, box.h + coverPadY * 2);

    // 2. 准备文字
    const text = state.newText;
    if (!text) return;

    // 字体缩放计算
    const fontSize = box.h * state.scale;
    ctx.font = `${state.weight} ${fontSize}px ${state.font}`;
    ctx.fillStyle = `rgb(${box.fg.join(',')})`;

    // 3. 排版与居中计算
    const spacing = state.spacing * (fontSize / 100); // 相对字距
    const textWidth = getTextWidth(text, spacing);
    
    // 原框中心点 + 手动偏移
    const centerX = box.x0 + box.w / 2 + state.offsetX;
    const centerY = box.y0 + box.h / 2 + state.offsetY;

    // 起点 X（向左推半个总宽度）
    const startX = centerX - textWidth / 2;

    // 绘制新文字
    drawTextWithSpacing(text, startX, centerY, spacing);
  }

  // ================= OCR 识别引擎 =================
  async function runOCR() {
    // 1. 预处理图片（放大以提高 OCR 精度）
    const ocrMax = 2000;
    const os = Math.min(1.5, ocrMax / Math.max(state.W, state.H));
    const oc = document.createElement('canvas');
    oc.width = Math.max(1, Math.round(state.W * os));
    oc.height = Math.max(1, Math.round(state.H * os));
    const octx = oc.getContext('2d');
    octx.drawImage(state.img, 0, 0, oc.width, oc.height);

    if (!worker) {
      worker = await Tesseract.createWorker('eng', 1, {
        logger: m => {
          if (m.status === 'recognizing text') {
            emptyEl.innerHTML = `<div>识别中... ${Math.round(m.progress*100)}%</div>`;
          }
        }
      });
    }

    // 限制只识别数字和符号
    await worker.setParameters({
      tessedit_char_whitelist: '0123456789.,+$%',
    });

    const { data } = await worker.recognize(oc);
    const sc = state.W / oc.width;

    // 获取所有识别出的文本块
    const words = (data.words || []).filter(w => w.text.trim().length > 0 && w.confidence > 20);
    
    // 合并相邻的数字
    const boxes = [];
    for (const w of words) {
      const box = {
        x0: w.bbox.x0 * sc, y0: w.bbox.y0 * sc,
        x1: w.bbox.x1 * sc, y1: w.bbox.y1 * sc,
      };
      box.w = box.x1 - box.x0;
      box.h = box.y1 - box.y0;
      
      // 如果高度太小，可能是噪点
      if (box.h < 10 || box.w < 10) continue;

      // 尝试与上一个合并（如果在同一水平线）
      if (boxes.length > 0) {
        const prev = boxes[boxes.length - 1];
        const overlapY = Math.min(prev.y1, box.y1) - Math.max(prev.y0, box.y0);
        if (overlapY > Math.min(prev.h, box.h) * 0.5) {
          // 合并
          prev.x0 = Math.min(prev.x0, box.x0);
          prev.x1 = Math.max(prev.x1, box.x1);
          prev.y0 = Math.min(prev.y0, box.y0);
          prev.y1 = Math.max(prev.y1, box.y1);
          prev.w = prev.x1 - prev.x0;
          prev.h = prev.y1 - prev.y0;
          continue;
        }
      }
      boxes.push(box);
    }

    // 如果没有识别出大块，就把整个图当作一个框
    if (boxes.length === 0) {
      boxes.push({ x0: state.W*0.1, y0: state.H*0.1, x1: state.W*0.9, y1: state.H*0.9, w: state.W*0.8, h: state.H*0.8 });
    }

    // 分析每个框的色彩
    const imgData = ctx.getImageData(0, 0, state.W, state.H).data;
    return boxes.map(box => {
      const colors = analyzeRegion(box, imgData, state.W, state.H);
      return { ...box, ...colors };
    });
  }

  // ================= 事件绑定 =================
  async function handleFile(file) {
    if (!file || !file.type.startsWith('image/')) return;
    
    emptyEl.style.display = 'block';
    emptyEl.innerHTML = `<div>正在读取...</div>`;
    canvas.style.display = 'none';

    const url = URL.createObjectURL(file);
    const im = new Image();
    
    im.onload = async () => {
      state.img = im;
      const maxSide = 2000;
      const scale = Math.min(1, maxSide / Math.max(im.width, im.height));
      state.W = Math.round(im.width * scale);
      state.H = Math.round(im.height * scale);
      
      canvas.width = state.W;
      canvas.height = state.H;
      ctx.drawImage(im, 0, 0, state.W, state.H);
      
      try {
        state.boxes = await runOCR();
        
        // 默认选中面积最大的那个框
        if (state.boxes.length > 0) {
          let maxArea = 0, maxIdx = 0;
          state.boxes.forEach((b, i) => {
            if (b.w * b.h > maxArea) { maxArea = b.w * b.h; maxIdx = i; }
          });
          state.activeBoxIndex = maxIdx;
        }

        state.offsetX = 0;
        state.offsetY = 0;
        renderResult();
        
        emptyEl.style.display = 'none';
        canvas.style.display = 'block';
        canvas.focus();
        downloadBtn.disabled = false;
        
      } catch (err) {
        alert("识别失败，请重试");
        emptyEl.innerHTML = `<div>识别失败，请重试</div>`;
      }
      URL.revokeObjectURL(url);
    };
    im.src = url;
  }

  $('uploadBtn').onclick = () => fileInput.click();
  emptyEl.onclick = () => fileInput.click();
  
  fileInput.onchange = e => {
    if (e.target.files[0]) handleFile(e.target.files[0]);
    fileInput.value = '';
  };

  // 输入控制
  textInput.oninput = e => { state.newText = e.target.value; renderResult(); };
  fontSel.onchange = e => { state.font = e.target.value; renderResult(); };
  
  weightRange.oninput = e => {
    state.weight = parseInt(e.target.value);
    $('weightVal').textContent = state.weight;
    renderResult();
  };
  
  spacingRange.oninput = e => {
    state.spacing = parseFloat(e.target.value);
    $('spacingVal').textContent = state.spacing;
    renderResult();
  };
  
  scaleRange.oninput = e => {
    state.scale = parseInt(e.target.value) / 100;
    $('scaleVal').textContent = e.target.value + '%';
    renderResult();
  };

  // 手动微调：拖拽画布
  canvas.addEventListener('pointerdown', e => {
    if (!state.img) return;
    isDragging = true;
    dragStart = { x: e.clientX, y: e.clientY };
    canvas.setPointerCapture(e.pointerId);
  });

  canvas.addEventListener('pointermove', e => {
    if (!isDragging) return;
    const dx = e.clientX - dragStart.x;
    const dy = e.clientY - dragStart.y;
    
    // 将屏幕像素移动转换为画布像素移动
    const rect = canvas.getBoundingClientRect();
    const scaleX = state.W / rect.width;
    const scaleY = state.H / rect.height;
    
    state.offsetX += dx * scaleX;
    state.offsetY += dy * scaleY;
    
    dragStart = { x: e.clientX, y: e.clientY };
    renderResult();
  });

  canvas.addEventListener('pointerup', e => {
    isDragging = false;
    canvas.releasePointerCapture(e.pointerId);
  });

  // 手动微调：键盘方向键
  canvas.addEventListener('keydown', e => {
    if (!state.img) return;
    const step = e.shiftKey ? 10 : 1; // 按住 Shift 加速
    let moved = false;
    
    if (e.key === 'ArrowLeft') { state.offsetX -= step; moved = true; }
    if (e.key === 'ArrowRight') { state.offsetX += step; moved = true; }
    if (e.key === 'ArrowUp') { state.offsetY -= step; moved = true; }
    if (e.key === 'ArrowDown') { state.offsetY += step; moved = true; }
    
    if (moved) {
      e.preventDefault();
      renderResult();
    }
  });

  downloadBtn.onclick = () => {
    if (!state.img) return;
    canvas.toBlob(blob => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = '完美改数字_' + Date.now() + '.png';
      a.click();
    }, 'image/png');
  };

  // 拖拽支持
  ['dragenter', 'dragover'].forEach(t => document.addEventListener(t, e => {
    e.preventDefault(); stage.style.border = '2px dashed #3b82f6';
  }));
  ['dragleave', 'drop'].forEach(t => document.addEventListener(t, e => {
    e.preventDefault(); stage.style.border = 'none';
    if (t === 'drop' && e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
  }));

})();
</script>
</body>
</html>
