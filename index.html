<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>账单信息科普演示生成器</title>
<!-- 引入各大 UI 字体 -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #4f46e5;
    --primary-hover: #4338ca;
    --bg: #0f1115;
    --panel: #161920;
    --border: #2a2f3d;
    --text: #e6e8ee;
    --subtext: #8b93a5;
    --success: #10b981;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); height: 100vh; overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  .app { display: flex; height: 100vh; }

  /* 左侧面板 */
  .panel {
    width: 360px; flex: none; padding: 24px 20px;
    background: var(--panel); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 16px; overflow-y: auto;
  }
  .brand h1 { font-size: 18px; font-weight: 700; color: #fff; letter-spacing: 0.5px; }
  .brand p { font-size: 12px; color: var(--subtext); margin-top: 4px; }
  
  .warning {
    font-size: 11px; color: #f87171; background: rgba(248, 113, 113, 0.1);
    padding: 8px 12px; border-radius: 6px; border: 1px solid rgba(248, 113, 113, 0.2);
    line-height: 1.5; margin-top: 5px;
  }

  .group { display: flex; flex-direction: column; gap: 8px; }
  .glabel { font-size: 12px; color: var(--subtext); font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
  
  input[type="text"] {
    background: #1b1f2a; border: 1px solid var(--border); color: #fff;
    border-radius: 8px; padding: 10px 14px; font-size: 15px; width: 100%; outline: none;
    font-family: inherit; transition: 0.2s;
  }
  input[type="text"]:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2); }
  
  button.primary {
    padding: 12px; border-radius: 10px; border: none; cursor: pointer;
    background: var(--primary); color: #fff; font-size: 14px; font-weight: 600;
    transition: 0.2s; display: flex; justify-content: center; align-items: center; gap: 8px;
  }
  button.primary:hover:not(:disabled) { background: var(--primary-hover); }
  button.primary:disabled { opacity: 0.5; cursor: not-allowed; }
  
  button.success {
    background: var(--success); font-size: 14px; padding: 12px;
  }
  button.success:hover { background: #059669; }

  .slider-row { display: flex; align-items: center; gap: 10px; margin-top: 4px; }
  .slider-row span { font-size: 11px; color: var(--subtext); width: 35px; text-align: right; }
  input[type="range"] {
    -webkit-appearance: none; appearance: none; height: 4px; border-radius: 2px;
    background: var(--border); outline: none; flex: 1;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%;
    background: var(--primary); cursor: pointer; border: 2px solid var(--panel);
  }

  /* 右侧画布 */
  .stage {
    flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center;
    padding: 20px; position: relative; overflow: hidden;
    background: #0b0d10; background-image: radial-gradient(circle at center, #1a1d24 0%, #0b0d10 100%);
  }
  #cv { max-width: 100%; max-height: 100%; display: none; box-shadow: 0 20px 60px rgba(0,0,0,0.6); cursor: move; }
  .empty {
    text-align: center; color: var(--subtext); font-size: 15px; line-height: 2;
    cursor: pointer; padding: 60px; border: 2px dashed var(--border); border-radius: 20px;
    transition: 0.3s; background: rgba(22, 25, 32, 0.5);
  }
  .empty:hover { border-color: var(--primary); color: #fff; background: rgba(79, 70, 229, 0.05); }
  
  /* 提示框 */
  #toast {
    position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
    background: var(--success); color: #fff; padding: 8px 16px; border-radius: 20px;
    font-size: 13px; opacity: 0; transition: 0.3s; pointer-events: none; z-index: 10;
  }
</style>
</head>
<body>
<div class="app">
  <aside class="panel">
    <header class="brand">
      <h1>账单防骗科普生成器</h1>
      <p>专为演示教学打造 · 修复黑块与截断Bug</p>
      <div class="warning">⚠️ 严禁将此工具用于伪造交易记录、诈骗等违法行为，仅限教学演示使用。</div>
    </header>

    <button class="primary" id="uploadBtn">1. 上传原始账单截图</button>

    <div class="group">
      <div class="glabel">2. 修改核心信息 (实时预览)</div>
      <input type="text" id="inputAmount" placeholder="金额 (例如: +6,750.00)" spellcheck="false">
      <input type="text" id="inputTime" placeholder="时间 (例如: 2026-06-18 23:28:59)" spellcheck="false">
      <input type="text" id="inputOrderId" placeholder="订单号" spellcheck="false">
    </div>

    <button class="primary success" id="generateBtn">✨ 一键生成演示数据</button>

    <div class="group">
      <div class="glabel">全局字体微调</div>
      <select id="fontSel" style="background:#1b1f2a; color:white; padding:8px; border-radius:6px; border:1px solid var(--border);">
        <option value="Inter, sans-serif">Inter (系统 UI 默认)</option>
        <option value="Roboto, sans-serif">Roboto (安卓风)</option>
        <option value="Roboto Mono, monospace">Roboto Mono (等宽数字)</option>
        <option value="Arial, sans-serif">Arial</option>
      </select>
      <div class="slider-row">
        <span>缩放</span>
        <input type="range" id="scaleXRange" min="80" max="120" step="1" value="100">
        <span id="scaleXVal" style="width:35px">100%</span>
      </div>
    </div>

    <button class="primary" id="downloadBtn" disabled style="margin-top:auto">下载修改后的图片</button>
  </aside>

  <main class="stage" id="stage">
    <div id="toast">✅ 演示数据已生成</div>
    <div class="empty" id="empty">
      <div style="font-size:48px;margin-bottom:12px">📱</div>
      <div>点击上传账单截图，自动提取金额/时间/单号</div>
    </div>
    <canvas id="cv" tabindex="0"></canvas>
  </main>
</div>

<input type="file" id="fileInput" accept="image/*" hidden>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
(function () {
  'use strict';

  const $ = id => document.getElementById(id);
  const canvas = $('cv');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const stage = $('stage');
  const emptyEl = $('empty');
  const fileInput = $('fileInput');
  const inputAmount = $('inputAmount');
  const inputTime = $('inputTime');
  const inputOrderId = $('inputOrderId');
  const generateBtn = $('generateBtn');
  const fontSel = $('fontSel');
  const scaleXRange = $('scaleXRange');
  const downloadBtn = $('downloadBtn');
  const toast = $('toast');

  const state = {
    img: null, W: 0, H: 0,
    regions: [], 
    text: { amount: '', time: '', orderId: '' },
    font: 'Inter, sans-serif',
    scaleX: 1
  };

  let worker = null;
  let isDragging = false;
  let dragStart = { x: 0, y: 0 };
  let activeRegionIndex = -1;

  function showToast(msg) {
    toast.textContent = msg;
    toast.style.opacity = 1;
    setTimeout(() => toast.style.opacity = 0, 2000);
  }

  // ================= 1. 深度图像化验分析 (修复黑块Bug) =================
  function getRealInkBounds(box, data, W, H) {
    // 【核心修复】将浮点坐标转为整数，防止 data 数组越界导致背景色变为 NaN/黑色
    const bx0 = Math.floor(box.x0);
    const bx1 = Math.ceil(box.x1);
    const by0 = Math.floor(box.y0);
    const by1 = Math.ceil(box.y1);

    let minX = bx1, maxX = bx0, minY = by1, maxY = by0;
    let fgCount = 0;
    
    // 采样外围背景
    let rSum=0, gSum=0, bSum=0, cnt=0;
    const pad = 10;
    for(let y=Math.max(0, by0-pad); y<Math.min(H, by1+pad); y++){
        for(let x=Math.max(0, bx0-pad); x<Math.min(W, bx1+pad); x++){
            if(x>=bx0 && x<=bx1 && y>=by0 && y<=by1) continue;
            const i = (y*W+x)*4; 
            rSum+=data[i]; gSum+=data[i+1]; bSum+=data[i+2]; cnt++;
        }
    }
    // 兜底：确保背景色是正常的 RGB 数值
    const outerBg = (cnt > 0 && !isNaN(rSum)) ? [rSum/cnt, gSum/cnt, bSum/cnt] : [255,255,255];

    // 寻找墨迹边界
    for (let y = Math.max(0, by0); y < Math.min(H, by1); y++) {
      for (let x = Math.max(0, bx0); x < Math.min(W, bx1); x++) {
        const i = (y * W + x) * 4;
        const r = data[i], g = data[i+1], b = data[i+2];
        const diff = Math.abs(r - outerBg[0]) + Math.abs(g - outerBg[1]) + Math.abs(b - outerBg[2]);
        if (diff > 60) { 
          fgCount++;
          if (x < minX) minX = x; if (x > maxX) maxX = x;
          if (y < minY) minY = y; if (y > maxY) maxY = y;
        }
      }
    }

    if (fgCount < 10) return { ...box, inkRatio: 0, fg: [0,0,0], bg: outerBg };

    const realW = Math.max(1, maxX - minX);
    const realH = Math.max(1, maxY - minY);
    
    // 提取前景文字色
    const fgPixels = [];
    for (let y = minY; y <= maxY; y++) {
      for (let x = minX; x <= maxX; x++) {
        const i = (y * W + x) * 4;
        const r = data[i], g = data[i+1], b = data[i+2];
        const diff = Math.abs(r - outerBg[0]) + Math.abs(g - outerBg[1]) + Math.abs(b - outerBg[2]);
        fgPixels.push({ d: diff, r, g, b });
      }
    }
    fgPixels.sort((a, b) => b.d - a.d);
    let fg = [0,0,0];
    if(fgPixels.length>0){
        const topN = Math.max(1, Math.floor(fgPixels.length * 0.15)); 
        let r=0,g=0,b=0; for(let i=0;i<topN;i++){ r+=fgPixels[i].r; g+=fgPixels[i].g; b+=fgPixels[i].b; }
        fg = [Math.round(r/topN), Math.round(g/topN), Math.round(b/topN)];
    }

    return {
      x0: minX, y0: minY, x1: maxX, y1: maxY,
      w: realW, h: realH,
      fg, bg: outerBg
    };
  }

  // ================= 2. 高保真绘制 =================
  function getTextWidth(text, letterSpacing) {
    let w = 0;
    for (let i = 0; i < text.length; i++) w += ctx.measureText(text[i]).width + letterSpacing;
    return w;
  }

  function renderResult() {
    if (!state.img) return;
    const W = state.W, H = state.H;

    ctx.clearRect(0, 0, W, H);
    ctx.drawImage(state.img, 0, 0, W, H);

    state.regions.forEach((box, idx) => {
      if (!box) return;
      const text = state.text[box.type];
      if (!text) return; 

      // 覆盖原图 (使用保护机制防止 NaN)
      const bgStr = box.bg.map(v => isNaN(v) ? 255 : Math.round(v)).join(',');
      ctx.fillStyle = `rgb(${bgStr})`;
      
      const coverPadX = Math.max(2, box.w * 0.05);
      const coverPadY = Math.max(2, box.h * 0.15);
      ctx.fillRect(box.x0 - coverPadX, box.y0 - coverPadY, box.w + coverPadX*2, box.h + coverPadY*2);

      // 计算字号
      ctx.font = `500 100px ${state.font}`;
      const metrics = ctx.measureText(text);
      const rawH = metrics.actualBoundingBoxAscent + metrics.actualBoundingBoxDescent;
      
      let finalFontSize = rawH > 0 ? (box.h / rawH) * 100 : 100;
      
      const tempSpacing = 0;
      ctx.font = `500 ${finalFontSize}px ${state.font}`;
      const testWidth = getTextWidth(text, tempSpacing);

      // 超长压缩
      if (testWidth > box.w * 1.05) {
          finalFontSize = finalFontSize * (box.w * 1.05 / testWidth);
      }

      ctx.font = `500 ${finalFontSize}px ${state.font}`;
      const fgStr = box.fg.map(v => isNaN(v) ? 0 : Math.round(v)).join(',');
      ctx.fillStyle = `rgb(${fgStr})`;
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';

      // 定位
      const centerY = box.y0 + box.h / 2 + (box.offsetY || 0);
      const startX = box.x0 + (box.offsetX || 0);
      
      // 垂直居中偏移
      const yOffset = (metrics.actualBoundingBoxAscent - metrics.actualBoundingBoxDescent) / 2;
      
      ctx.save();
      // 应用全局缩放（从中心点）
      const centerX = box.x0 + box.w / 2;
      ctx.translate(centerX, centerY);
      ctx.scale(state.scaleX, 1);
      ctx.translate(-centerX, -centerY);
      
      ctx.fillText(text, startX, centerY + yOffset);
      ctx.restore();

      // 绘制高亮框
      if (isDragging && idx === activeRegionIndex) {
        ctx.strokeStyle = '#4f46e5';
        ctx.lineWidth = 2;
        ctx.strokeRect(box.x0 - 5, box.y0 - 5, box.w + 10, box.h + 10);
      }
    });
  }

  // ================= 3. 智能识别与分类 (合并长文本) =================
  async function runOCR() {
    const os = Math.min(1.5, 1600 / Math.max(state.W, state.H));
    const oc = document.createElement('canvas');
    oc.width = Math.round(state.W * os);
    oc.height = Math.round(state.H * os);
    const octx = oc.getContext('2d');
    octx.filter = 'contrast(1.2) grayscale(1)';
    octx.drawImage(state.img, 0, 0, oc.width, oc.height);

    if (!worker) {
      worker = await Tesseract.createWorker('eng', 1, {
        logger: m => {
          if (m.status === 'recognizing text') {
            emptyEl.innerHTML = `<div>AI 正在精准定位核心数据... ${Math.round(m.progress*100)}%</div>`;
          }
        }
      });
    }

    await worker.setParameters({ tessedit_char_whitelist: '0123456789+-.:, ' });
    const { data } = await worker.recognize(oc);
    const sc = state.W / oc.width;

    // 1. 提取所有单词并按行合并（解决时间和单号被截断的问题）
    const rawWords = (data.words || []).filter(w => w.text.trim().length > 0 && w.confidence > 30).map(w => ({
      x0: w.bbox.x0 * sc, y0: w.bbox.y0 * sc,
      x1: w.bbox.x1 * sc, y1: w.bbox.y1 * sc,
      text: w.text.replace(/\s/g, '')
    })).sort((a,b) => a.y0 - b.y0 || a.x0 - b.x0);

    const mergedBoxes = [];
    for (const w of rawWords) {
      let merged = false;
      for (const m of mergedBoxes) {
        // 如果垂直方向有重叠，且水平方向距离相近，则合并为同一个文本框
        const overlapY = Math.min(m.y1, w.y1) - Math.max(m.y0, w.y0);
        if (overlapY > Math.min(m.y1-m.y0, w.y1-w.y0) * 0.5) {
            m.x1 = Math.max(m.x1, w.x1);
            m.y0 = Math.min(m.y0, w.y0);
            m.y1 = Math.max(m.y1, w.y1);
            m.text += w.text;
            merged = true;
            break;
        }
      }
      if (!merged) mergedBoxes.push({ ...w });
    }

    let amountBox = null, timeBox = null, orderBox = null;
    let maxAmountArea = 0, maxOrderWidth = 0;

    // 2. 对合并后的文本框进行分类
    mergedBoxes.forEach(box => {
      const text = box.text;
      const w = box.x1 - box.x0;
      const h = box.y1 - box.y0;

      // 金额：高度最大，且有小数点或加号
      if (/\d/.test(text) && (text.includes('.') || text.includes('+'))) {
        const area = w * h;
        if (area > maxAmountArea) { maxAmountArea = area; amountBox = box; }
      } 
      // 时间：包含 : 或 - 
      else if (text.includes(':') || text.includes('-')) {
        if (!timeBox || w > (timeBox.x1 - timeBox.x0)) timeBox = box;
      } 
      // 订单号：极其长（超过12位数字）
      else if (/^\d{12,}$/.test(text)) {
         if (w > maxOrderWidth) { maxOrderWidth = w; orderBox = box; }
      }
    });

    const imgData = ctx.getImageData(0, 0, state.W, state.H).data;
    const regions = [];

    if (amountBox) {
      const b = getRealInkBounds(amountBox, imgData, state.W, state.H);
      b.type = 'amount'; b.offsetX = 0; b.offsetY = 0;
      regions.push(b);
    }
    if (timeBox) {
      const b = getRealInkBounds(timeBox, imgData, state.W, state.H);
      b.type = 'time'; b.offsetX = 0; b.offsetY = 0;
      regions.push(b);
    }
    if (orderBox) {
      const b = getRealInkBounds(orderBox, imgData, state.W, state.H);
      b.type = 'orderId'; b.offsetX = 0; b.offsetY = 0;
      regions.push(b);
    }

    return regions;
  }

  // ================= 4. 事件绑定 =================
  async function handleFile(file) {
    if (!file || !file.type.startsWith('image/')) return;
    
    emptyEl.style.display = 'block';
    emptyEl.innerHTML = `<div>正在载入图片...</div>`;
    canvas.style.display = 'none';

    const url = URL.createObjectURL(file);
    const im = new Image();
    
    im.onload = async () => {
      state.img = im;
      const maxSide = 1800;
      const scale = Math.min(1, maxSide / Math.max(im.width, im.height));
      state.W = Math.round(im.width * scale);
      state.H = Math.round(im.height * scale);
      
      canvas.width = state.W;
      canvas.height = state.H;
      ctx.drawImage(im, 0, 0, state.W, state.H);
      
      try {
        state.regions = await runOCR();
        
        // 默认填充
        if (state.regions.find(r => r.type === 'amount') && !state.text.amount) state.text.amount = '+8,888.88';
        if (state.regions.find(r => r.type === 'time') && !state.text.time) state.text.time = '2026-06-18 12:00:00';
        if (state.regions.find(r => r.type === 'orderId') && !state.text.orderId) state.text.orderId = '20260618200040011100410007156705';

        inputAmount.value = state.text.amount;
        inputTime.value = state.text.time;
        inputOrderId.value = state.text.orderId;

        renderResult();
        
        emptyEl.style.display = 'none';
        canvas.style.display = 'block';
        canvas.focus();
        downloadBtn.disabled = false;
        
      } catch (err) {
        alert("识别失败，请刷新重试");
        emptyEl.innerHTML = `<div>识别失败，请重试</div>`;
      }
      URL.revokeObjectURL(url);
    };
    im.src = url;
  }

  generateBtn.onclick = () => {
    if (!state.img) return alert("请先上传图片！");
    
    const money = (Math.random() * 9000 + 100).toFixed(2);
    const amountStr = `+${Number(money).toLocaleString('en-US', {minimumFractionDigits: 2})}`;
    
    const d = new Date(Date.now() - Math.random() * 100000000);
    const p = n => n.toString().padStart(2, '0');
    const timeStr = `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;

    let orderStr = d.getFullYear().toString() + p(d.getMonth()+1) + p(d.getDate());
    while (orderStr.length < 28) orderStr += Math.floor(Math.random() * 10);
    
    state.text.amount = amountStr;
    state.text.time = timeStr;
    state.text.orderId = orderStr;

    inputAmount.value = amountStr;
    inputTime.value = timeStr;
    inputOrderId.value = orderStr;

    renderResult();
    showToast('✅ 演示数据已生成');
  };

  $('uploadBtn').onclick = () => fileInput.click();
  emptyEl.onclick = () => fileInput.click();
  fileInput.onchange = e => {
    if (e.target.files[0]) handleFile(e.target.files[0]);
    fileInput.value = '';
  };

  inputAmount.oninput = e => { state.text.amount = e.target.value; renderResult(); };
  inputTime.oninput = e => { state.text.time = e.target.value; renderResult(); };
  inputOrderId.oninput = e => { state.text.orderId = e.target.value; renderResult(); };
  
  fontSel.onchange = e => { state.font = e.target.value; renderResult(); };
  scaleXRange.oninput = e => { state.scaleX = parseInt(e.target.value)/100; $('scaleXVal').textContent = e.target.value + '%'; renderResult(); };

  // 鼠标拖拽微调区域位置
  canvas.addEventListener('pointerdown', e => {
    if (!state.img) return;
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (state.W / rect.width);
    const my = (e.clientY - rect.top) * (state.H / rect.height);

    activeRegionIndex = -1;
    state.regions.forEach((box, i) => {
        if (mx >= box.x0 && mx <= box.x1 && my >= box.y0 && my <= box.y1) {
            activeRegionIndex = i;
        }
    });

    if (activeRegionIndex !== -1) {
        isDragging = true;
        dragStart = { x: e.clientX, y: e.clientY };
        canvas.setPointerCapture(e.pointerId);
    }
  });

  canvas.addEventListener('pointermove', e => {
    if (!isDragging || activeRegionIndex === -1) return;
    const dx = e.clientX - dragStart.x;
    const dy = e.clientY - dragStart.y;
    const rect = canvas.getBoundingClientRect();
    
    const box = state.regions[activeRegionIndex];
    box.offsetX = (box.offsetX || 0) + dx * (state.W / rect.width);
    box.offsetY = (box.offsetY || 0) + dy * (state.H / rect.height);
    
    dragStart = { x: e.clientX, y: e.clientY };
    renderResult();
  });

  canvas.addEventListener('pointerup', e => {
    isDragging = false;
    canvas.releasePointerCapture(e.pointerId);
    renderResult();
  });

  downloadBtn.onclick = () => {
    if (!state.img) return;
    canvas.toBlob(blob => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = '科普演示_' + Date.now() + '.png';
      a.click();
    }, 'image/png');
  };

  ['dragenter', 'dragover'].forEach(t => document.addEventListener(t, e => {
    e.preventDefault(); stage.style.border = '2px dashed #4f46e5';
  }));
  ['dragleave', 'drop'].forEach(t => document.addEventListener(t, e => {
    e.preventDefault(); stage.style.border = 'none';
    if (t === 'drop' && e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
  }));

})();
</script>
</body>
</html>
